
name: Update Featured Projects

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate latest projects
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const fs = require('fs');

            const username = 'ylamkhan';
            const readmePath = 'README.md';

            // Retrieve repositories accessible to the token
            const repos = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              {
                visibility: 'all',
                affiliation: 'owner',
                per_page: 100,
                sort: 'pushed',
                direction: 'desc'
              }
            );

            // Select the latest three owned projects
            const latest = repos
              .filter(repo =>
                repo.owner.login.toLowerCase() === username &&
                !repo.fork &&
                !repo.archived &&
                repo.name.toLowerCase() !== username
              )
              .sort((a, b) =>
                new Date(b.pushed_at) - new Date(a.pushed_at)
              )
              .slice(0, 3);

            const projects = latest.map(repo => {
              const date = new Date(repo.pushed_at)
                .toISOString()
                .replace('T', ' ')
                .slice(0, 16) + ' UTC';

              const description = (repo.description ||
                'No description provided.')
                .replace(/\|/g, '\\|')
                .replace(/\r?\n/g, ' ');

              const visibility = repo.private
                ? '🔒 Private'
                : '🌐 Public';

              return [
                `### 🚀 [${repo.name}](${repo.html_url})`,
                description,
                '',
                `- **Language:** ${repo.language || 'Not specified'}`,
                `- **Last push:** ${date}`,
                `- **Visibility:** ${visibility}`,
                ''
              ].join('\n');
            }).join('\n');

            const start = '<!-- FEATURED-PROJECTS:START -->';
            const end = '<!-- FEATURED-PROJECTS:END -->';

            let readme = fs.readFileSync(readmePath, 'utf8');

            const startIndex = readme.indexOf(start);
            const endIndex = readme.indexOf(end);

            if (startIndex === -1 || endIndex === -1 ||
                endIndex < startIndex) {
              throw new Error('Featured Projects markers not found.');
            }

            const updatedSection = [
              start,
              '',
              'Projects automatically ranked by latest push activity.',
              '',
              projects || '*No eligible repositories found.*',
              end
            ].join('\n');

            readme =
              readme.slice(0, startIndex) +
              updatedSection +
              readme.slice(endIndex + end.length);

            fs.writeFileSync(readmePath, readme);

      - name: Commit README updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update latest featured projects"
          file_pattern: README.md
